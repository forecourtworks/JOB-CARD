<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d264d" />
  <meta name="description" content="Forecourt Works Ltd – Digital JOB CARD & Sign-Off Form" />
  <title>Forecourt Works Ltd | JOB CARD</title>
  <!-- Full form restored; app.js loaded+patched at runtime for Section 1 single-page PDF -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <p style="font-family:system-ui;padding:2rem">Restoring full form… If this persists, hard-refresh. The complete index is being deployed.</p>
  <script src="fsw-pdf-theme.js"></script>
  <script>
  (async function () {
    const APP_URL = 'https://cdn.jsdelivr.net/gh/forecourtworks/JOB-CARD@0cef3e174732b9a02e622b2e14b7c9f26bbab9f2/app.js';
    const INDEX_URL = 'https://cdn.jsdelivr.net/gh/forecourtworks/JOB-CARD@0cef3e174732b9a02e622b2e14b7c9f26bbab9f2/index.html';
    try {
      // Load full form HTML body from known-good index and inject
      const idxRes = await fetch(INDEX_URL);
      const idxHtml = await idxRes.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(idxHtml, 'text/html');
      // Copy styles from good index
      doc.querySelectorAll('style').forEach(s => document.head.appendChild(s.cloneNode(true)));
      doc.querySelectorAll('link[rel=stylesheet]').forEach(l => {
        if (![...document.querySelectorAll('link')].some(x => x.href === l.href))
          document.head.appendChild(l.cloneNode(true));
      });
      // Replace body content (keep our scripts at end)
      const newBody = doc.body.cloneNode(true);
      // Remove script tags from imported body (we load app separately)
      newBody.querySelectorAll('script').forEach(s => s.remove());
      document.body.innerHTML = newBody.innerHTML;
      // Load and patch app.js
      const res = await fetch(APP_URL);
      let src = await res.text();
      const n1 = 'y = drawHeaderAndTitle();\n\n\n      // Meta strip moved into header subtitle pill';
      const n1b = 'y = drawHeaderAndTitle();\n\n      // Meta strip moved into header subtitle pill';
      const i1 = 'y = drawHeaderAndTitle();\n\n      // SECTION 1 single-page lock\n      const _checkPageOrig = checkPage;\n      const _ensureSpaceOrig = ensureSpace;\n      checkPage = function () {};\n      ensureSpace = function () {};\n\n      // Meta strip moved into header subtitle pill';
      if (src.includes(n1)) src = src.replace(n1, i1);
      else if (src.includes(n1b)) src = src.replace(n1b, i1);
      const n2 = '      // Page break: page 1 = PART A + PART B only';
      const i2 = '      // Restore page-break helpers\n      checkPage = _checkPageOrig;\n      ensureSpace = _ensureSpaceOrig;\n\n      // Page break: page 1 = PART A + PART B only';
      if (src.includes(n2)) src = src.replace(n2, i2);
      src = src.replace('        const boxH = 18;\n        checkPage(36);', '        const boxH = 14;\n        // section1');
      src = src.replace('        const cellH = 11;\n        const rows = Math.ceil(pairs.length / cols);\n        checkPage(rows * (cellH + gap) + 4);', '        const cellH = 9;\n        const rows = Math.ceil(pairs.length / cols);\n        checkPage(rows * (cellH + gap) + 4);');
      src = src.replace("          doc.text(String(pair[0] || '').toUpperCase(), x + 2, yy + 3.5);\n          doc.setFont('helvetica', 'bold');\n          doc.setFontSize(8);\n          doc.setTextColor(15, 23, 42);\n          const v = String(pair[1] == null || pair[1] === '' ? '-' : pair[1]).toUpperCase();\n          const lines = doc.splitTextToSize(v, cellW - 4);\n          doc.text(lines[0], x + 2, yy + 8);", "          doc.text(String(pair[0] || '').toUpperCase(), x + 2, yy + 3.0);\n          doc.setFont('helvetica', 'bold');\n          doc.setFontSize(7.5);\n          doc.setTextColor(15, 23, 42);\n          const v = String(pair[1] == null || pair[1] === '' ? '-' : pair[1]).toUpperCase();\n          const lines = doc.splitTextToSize(v, cellW - 4);\n          doc.text(lines[0], x + 2, yy + 6.8);");
      src = src.replace('        doc.text(title, m + 2.5, y + 4.4);\n        y += 9;\n        doc.setTextColor(30, 30, 30);\n      }', '        doc.text(title, m + 2.5, y + 4.4);\n        y += 7.5;\n        doc.setTextColor(30, 30, 30);\n      }');
      src = src.replace('y += 6.5 + boxH + 6;', 'y += 5.2 + boxH + 3;');
      (0, eval)(src);
      console.log('JOB CARD: Section 1 single-page PDF patch applied');
    } catch (e) {
      console.error(e);
      document.body.innerHTML = '<p style="padding:2rem;color:#b91c1c">Load failed: ' + e.message + '. Hard-refresh or check console.</p>';
    }
  })();
  </script>
</body>
</html>
